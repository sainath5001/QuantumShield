[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qguard-quantum"
version = "0.1.0"
description = "Q-Guard educational quantum research module (Qiskit). Not for attacking Ethereum keys."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Q-Guard" }]
dependencies = [
  "qiskit>=1.2.0,<2.0.0",
  "qiskit-aer>=0.14.0,<0.16.0",
  "numpy>=1.24.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0"]

[project.scripts]
qguard-quantum = "qguard_quantum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
  "ignore:The property ``qiskit.circuit.instruction.Instruction.condition`` is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
